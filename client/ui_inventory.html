,Math.round(h*scale));   return '<div style="width:'+dw+'px;height:'+dh+'px;overflow:hidden;position:relative">'    +'<img loading="lazy" src="assets/'+esc(it.image)+'" style="position:absolute;left:'+(-x*scale)+'px;top:'+(-y*scale)+'px;width:'+Math.round(it.frame.texW*scale)+'px;height:'+Math.round(it.frame.texH*scale)+'px;max-width:none;max-height:none"></div>';  }  return '<img loading="lazy" src="assets/'+esc(it.image)+'">'; } function card(it){  if(kw && !it.key.toLowerCase().includes(kw))return '';  const shared=it.pages.length>1;  return '<div class="card"><div class="thumb">'+thumb(it)+'</div>'  +'<div class="meta"><div class="path">'+esc(it.key)+'</div>'  +'<div>'+it.w+'x'+it.h+(it.count?' · 引用<b class="count"> '+it.count+'</b> 处':'')+'</div>'  +'<div class="tags">'+(it.dyn?'<span class="tag dyn">动态加载</span>':'')+(shared?'<span class="tag share">共用:'+esc(it.pages.join('/'))+'</span>':'')+(it.btn?'<span class="tag">按钮</span>':'')+'</div>'  +'</div></div>'; } function h2(t){const h=document.createElement('h2');h.textContent=t;return h;} function render(){  const app=$('#app');app.innerHTML='';  if(cur==='缺失/内置'||cur==='全部'){   if(cur!=='全部'){renderMiss(app);return;}  }  if(cur==='未引用'){   app.appendChild(h2('当前 6 个页面均未引用的散图（'+D.unused.length+' 张，换皮后可删）'));   const g=document.createElement('div');g.className='grid';   g.innerHTML=D.unused.filter(u=>!kw||u.key.toLowerCase().includes(kw)).map(u=>'<div class="card"><div class="thumb"><img loading="lazy" src="assets/'+esc(u.image)+'"></div><div class="meta"><div class="path">'+esc(u.key)+'</div><div>'+u.w+'x'+u.h+'</div><div class="tags"><span class="tag unused">未引用</span></div></div></div>').join('');   app.appendChild(g);return;  }  const pagesToShow=cur==='全部'?PAGES.slice(1,7):[cur];  pagesToShow.forEach(pg=>{   const list=D.items.filter(it=>it.pages.includes(pg));   if(!list.length)return;   app.appendChild(h2(pg+'（'+list.length+' 项）'));   FUNCS.forEach(fn=>{    const sub=list.filter(it=>it.func===fn).sort((a,
