name: Build Native Packages

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ENGINE_URL: https://github.com/cocos-creator/engine-native/archive/refs/tags/v2.4.15.tar.gz
  ENGINE_DIR: cocos2d-x

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download Cocos2d-x engine
        run: |
          curl -L "$ENGINE_URL" -o engine.tar.gz
          tar xzf engine.tar.gz
          mv engine-native-2.4.15 "$ENGINE_DIR"
          # 项目工程引用的引擎路径
          mkdir -p client/build/jsb-default/frameworks
          mv "$ENGINE_DIR" client/build/jsb-default/frameworks/cocos2d-x

      - name: Install NDK r21e
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;21.4.7075529"
          echo "NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties

      - name: Build unsigned release APK
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PNDK_ROOT=$NDK \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-android-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.android-studio/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Download Cocos2d-x engine
        run: |
          curl -L "$ENGINE_URL" -o engine.tar.gz
          tar xzf engine.tar.gz
          mv engine-native-2.4.15 "$ENGINE_DIR"
          mkdir -p client/build/jsb-default/frameworks
          mv "$ENGINE_DIR" client/build/jsb-default/frameworks/cocos2d-x

      - name: Build unsigned iOS app
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          xcodebuild -project SCMJ.xcodeproj \
            -target SCMJ-mobile \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          APP=$(find build -name "SCMJ.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r SCMJ-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-ios-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ-unsigned.ipa
