name: Build Native Packages

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK r21e
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --licenses > /dev/null || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;21.4.7075529" "ndk;25.1.8937393" "platforms;android-27" "build-tools;28.0.3"
          echo "NDK=$ANDROID_HOME/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" >> client/build/jsb-default/frameworks/runtime-src/proj.android-studio/local.properties

      - name: Build unsigned release APK
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :SCMJ:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-android-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.android-studio/app/build/outputs/apk/release/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned iOS app
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          xcodebuild -project SCMJ.xcodeproj \
            -target SCMJ-mobile \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac
        run: |
          APP=$(find build -name "SCMJ.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r SCMJ-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SCMJ-ios-unsigned
          path: client/build/jsb-default/frameworks/runtime-src/proj.ios_mac/SCMJ-unsigned.ipa
